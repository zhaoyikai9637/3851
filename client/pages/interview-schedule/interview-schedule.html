<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interview Schedule - JRS</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        .type-badge {
            background-color: #e0f2fe;
            color: #0369a1;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            display: inline-block;
        }
        .filter-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .filter-controls {
            display: flex;
            gap: 12px;
        }
        .date-picker-input {
            color: #475569;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><div class="brand-logo"></div><span class="brand-name">JRS</span></div>
        <div class="workspace-label">WORKSPACE</div>
        <ul class="nav-menu">
            <li class="nav-item">Dashboard</li>
            <li class="nav-item">Applications</li>
            <li class="nav-item">Candidates</li>
            <li class="nav-item">Job Postings</li>
            <li class="nav-item active">Interviews</li>
            <li class="nav-item">Notifications</li>
        </ul>
    </div>

    <div class="main-container">
        <header class="header">
            <h1 class="header-title">Interview Schedule</h1>
            <div class="user-profile">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="user-name">Sarah Mitchell</span>
                    <span class="user-role">HR Manager</span>
                </div>
            </div>
        </header>

        <div class="content-body">
            <!-- Top Controls & Filters -->
            <div class="filter-container">
                <div class="filter-controls">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search candidate..." style="width: 220px;">
                    <input type="date" id="dateFilter" class="form-control date-picker-input" style="width: 160px;">
                    <select id="statusFilter" class="form-control" style="width: 130px;">
                        <option value="">Status ▼</option>
                        <option value="Confirmed">Confirmed</option>
                        <option value="Pending">Pending</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="newInterviewBtn">+ New Interview</button>
            </div>

            <!-- Interviews Table Card -->
            <div class="card">
                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">Upcoming Interviews</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Candidate</th>
                            <th>Position</th>
                            <th>Location</th>
                            <th>Type</th>
                            <th>Interviewer</th>
                            <th>Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="interviewTableBody">
                        <!-- Rendered by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../../utils/api_utils.js"></script>
    <script src="interviewSchedule.js"></script>
</body>
</html>
