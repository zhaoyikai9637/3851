name: JRS test server CI

# Builds and tests the JRS (test server) folder. Database-backed suites
# (*.mysql.*) are excluded because CI has no MySQL instance.
on:
  push:
    paths:
      - "JRS/**"
      - ".github/workflows/jrs-ci.yml"
  workflow_dispatch:


# Each test step runs through report.sh, which turns the tail of a failing
# run into a single annotation so results can be read without the logs UI.
defaults:
  run:
    working-directory: JRS

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: JRS/package-lock.json
      - run: npm ci
      - run: bash -o pipefail -c 'npm run build 2>&1 | tee /tmp/out.txt' || { echo "::error title=Failure details::$(grep -E "not ok|Error|rror:|expected|actual|FAIL|×|✗|AssertionError|at .*test" /tmp/out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  root-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: JRS/package-lock.json
      - run: npm ci
      - run: bash -o pipefail -c 'npm test 2>&1 | tee /tmp/out.txt' || { echo "::error title=Failure details::$(grep -E "not ok|Error|rror:|expected|actual|FAIL|×|✗|AssertionError|at .*test" /tmp/out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  hr-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: JRS/package-lock.json
      - run: npm ci
      - run: bash -o pipefail -c 'npx vitest run --root jrs-hr-module/client 2>&1 | tee /tmp/out.txt' || { echo "::error title=Failure details::$(grep -E "not ok|Error|rror:|expected|actual|FAIL|×|✗|AssertionError|at .*test" /tmp/out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  hr-legacy-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JRS/JRS HR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: bash -o pipefail -c 'npx jest --testPathIgnorePatterns integration 2>&1 | tee /tmp/out.txt' || { echo "::error title=Failure details::$(grep -E "not ok|Error|rror:|expected|actual|FAIL|×|✗|AssertionError|at .*test" /tmp/out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  login-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: JRS/JRS Login and profile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: bash -o pipefail -c 'npm test 2>&1 | tee /tmp/out.txt' || { echo "::error title=Failure details::$(grep -E "not ok|Error|rror:|expected|actual|FAIL|×|✗|AssertionError|at .*test" /tmp/out.txt | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

  english-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run check:english
