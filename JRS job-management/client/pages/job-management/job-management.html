<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Management - JRS</title>
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <style>
        .action-btns {
            display: flex;
            gap: 8px;
        }
        .filter-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }
        .filter-controls {
            display: flex;
            gap: 12px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><div class="brand-logo"></div><span class="brand-name">JRS</span></div>
        <div class="workspace-label">WORKSPACE</div>
        <ul class="nav-menu">
            <li class="nav-item">Dashboard</li>
            <li class="nav-item">Applications</li>
            <li class="nav-item">Candidates</li>
            <li class="nav-item active">Job Postings</li>
            <li class="nav-item">Interviews</li>
            <li class="nav-item">Notifications</li>
        </ul>
    </div>

    <div class="main-container">
        <header class="header">
            <h1 class="header-title">Job Management</h1>
            <div class="user-profile">
                <div class="avatar"></div>
                <div class="user-info">
                    <span class="user-name">Sarah Mitchell</span>
                    <span class="user-role">HR Manager</span>
                </div>
            </div>
        </header>

        <div class="content-body">
            <!-- Filter & Search Header -->
            <div class="filter-header">
                <div class="filter-controls">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search job..." style="width: 220px;">
                    <select id="departmentFilter" class="form-control" style="width: 150px;">
                        <option value="">Department ▼</option>
                        <option value="IT">IT</option>
                        <option value="Design">Design</option>
                        <option value="HR">HR</option>
                    </select>
                    <select id="statusFilter" class="form-control" style="width: 130px;">
                        <option value="">Status ▼</option>
                        <option value="Active">Active</option>
                        <option value="Unpublished">Unpublished</option>
                    </select>
                </div>
                <button class="btn btn-primary" id="newJobBtn">+ New Job</button>
            </div>

            <!-- Job List Table Card -->
            <div class="card">
                <h3 style="font-size: 18px; font-weight: 600; margin-bottom: 16px;">Job List</h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Job Title</th>
                            <th>Department</th>
                            <th>Type</th>
                            <th>Applicants</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="jobTableBody">
                        <!-- Rendered by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="../../utils/api_utils.js"></script>
    <script src="jobManagement.js"></script>
</body>
</html>
