<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS - Check Your Email</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../../assets/css/buttons.css">
</head>
<body class="login-page recovery-page">
    <!-- Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-circles">
                <span class="circle circle-dark"></span>
                <span class="circle circle-blue"></span>
            </div>
            <div class="logo-text">
                <span class="logo-title">JRS</span>
                <span class="logo-subtitle">JOB RECRUITMENT SYSTEM</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="page-container">
        <div class="auth-card login-card">
            <h1 class="auth-title">Check your email</h1>
            <p class="auth-subtitle">
                If a candidate account exists, a 4-digit verification code will be sent to<br>
                <strong id="displayEmail">xxx@example.com</strong>
            </p>

            <form id="otpForm" action="../set-new-password/set-new-password.html" method="GET" novalidate>
                <!-- 4-Digit OTP Container -->
                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-box" pattern="\d*" required placeholder="-">
                    <input type="text" maxlength="1" class="otp-box" pattern="\d*" required placeholder="-">
                    <input type="text" maxlength="1" class="otp-box" pattern="\d*" required placeholder="-">
                    <input type="text" maxlength="1" class="otp-box" pattern="\d*" required placeholder="-">
                </div>
                <div class="error-message text-center" id="otpError"></div>

                <!-- Action Button -->
                <button type="submit" id="verifyBtn" class="btn-primary">Verify code</button>

                <!-- Resend Footer -->
                <div class="resend-container">
                    <span>Didn't receive the code?</span>
                    <button type="button" id="resendBtn" class="resend-link" disabled>
                        Resent (<span id="countdown">59</span>s)
                    </button>
                </div>

                <div class="resend-container" style="margin-top: 16px;">
                    <a href="../login/login.html" class="resend-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../../utils/api.js"></script>
    <script src="../../utils/check_utils.js"></script>
    <script src="check-email.js"></script>
</body>
</html>
