<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS - Reset Password</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-circles">
                <span class="circle circle-dark"></span>
                <span class="circle circle-blue"></span>
            </div>
            <div class="logo-text">
                <span class="logo-title">JRS</span>
                <span class="logo-subtitle">JOB RECRUITMENT SYSTEM</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="page-container">
        <div class="auth-card">
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">
                Please enter your registered email address, and we will send you an email containing a link to reset your password.
            </p>

            <!-- 提交后跳转至 check-email 目录下的 check-email.html -->
            <!-- 正确路径：../check-email/check-email.html -->
                <form id="forgotPasswordForm" action="../check-email/check-email.html" method="GET" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Input your email address" 
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <!-- Action Button -->
                <button type="submit" id="sendBtn" class="btn-primary">Send reset link</button>

                <!-- 返回 Login Page 目录下的 Login.html -->
                <div class="resend-container" style="margin-top: 24px;">
                    <a href="../Login Page/Login.html" class="resend-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <script src="forgot_utils.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
