<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS - Set New Password</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-circles">
                <span class="circle circle-dark"></span>
                <span class="circle circle-blue"></span>
            </div>
            <div class="logo-text">
                <span class="logo-title">JRS</span>
                <span class="logo-subtitle">JOB RECRUITMENT SYSTEM</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="page-container">
        <div class="auth-card">
            <h1 class="auth-title">Set new password</h1>
            <p class="auth-subtitle">
                Your new password must be different from previous used passwords.
            </p>

            <form id="resetPasswordForm" novalidate>
                <!-- New Password Field with Eye Icon -->
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-wrapper">
                        <input 
                            type="password" 
                            id="newPassword" 
                            placeholder="Input your new password" 
                            required
                        >
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                    <div class="error-message" id="newPasswordError"></div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        placeholder="Re-enter your new password" 
                        required
                    >
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <!-- Action Button -->
                <button type="submit" id="confirmBtn" class="btn-primary">Confirm</button>
            </form>
        </div>
    </main>

    <script src="reset_utils.js"></script>
    <script src="set-new-password.js"></script>
</body>
</html>
