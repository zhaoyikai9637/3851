<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS - Set New Password</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <!-- FontAwesome Eye Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-circles">
                <span class="circle circle-dark"></span>
                <span class="circle circle-blue"></span>
            </div>
            <div class="logo-text">
                <span class="logo-title">JRS</span>
                <span class="logo-subtitle">JOB RECRUITMENT SYSTEM</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="page-container">
        <div class="auth-card">
            <h1 class="auth-title">Set new password</h1>
            <p class="auth-subtitle">
                Use 8 to 72 ASCII characters with uppercase and lowercase English letters, a number and a special symbol.
            </p>

            <form id="resetPasswordForm" novalidate>
                <!-- New Password Field with Eye Icon -->
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="newPassword"
                            placeholder="Input your new password"
                            required
                        >
                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                    <div class="error-message" id="newPasswordError"></div>
                </div>

                <!-- Confirm Password Field -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your new password"
                        required
                    >
                    <div class="error-message" id="confirmPasswordError"></div>
                </div>

                <!-- Action Button -->
                <button type="submit" id="confirmBtn" class="btn-primary">Confirm</button>

                <div class="resend-container" style="margin-top: 24px;">
                    <a href="../login/login.html" class="resend-link"><i class="fa-solid fa-arrow-left"></i> Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../../utils/api.js"></script>
    <script src="../../utils/set_password_utils.js"></script>
    <script src="../../utils/password-policy.js"></script>
    <script src="set-new-password.js"></script>
</body>
</html>
