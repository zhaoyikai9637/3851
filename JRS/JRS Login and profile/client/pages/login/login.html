<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS - Login / Register</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-circles">
                <span class="circle circle-dark"></span>
                <span class="circle circle-blue"></span>
            </div>
            <div class="logo-text">
                <span class="logo-title">JRS</span>
                <span class="logo-subtitle">JOB RECRUITMENT SYSTEM</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="page-container">
        <div class="auth-card">
            <form id="loginForm" novalidate>
                <div id="registerNames" hidden>
                    <div class="form-group"><label for="registerFirstName">First name</label><input id="registerFirstName" type="text" maxlength="50" autocomplete="given-name"></div>
                    <div class="form-group"><label for="registerLastName">Last name</label><input id="registerLastName" type="text" maxlength="49" autocomplete="family-name"></div>
                    <p>Choose a password with at least 8 characters (maximum 72 UTF-8 bytes).</p>
                </div>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Input your email address"
                        required
                    >
                    <div class="error-message" id="emailError"></div>
                </div>

                <!-- Password Field -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Input your password"
                        required
                    >
                    <div class="error-message" id="passwordError"></div>
                </div>

                <!-- Action Button -->
                <button type="submit" id="loginBtn" class="btn-primary">Log in</button>
                <button type="button" id="registerToggle" class="btn-text">Create a candidate account</button>

                <!-- Additional Links -->
                <div class="form-footer">
                    <a href="../forgot-password/forgot-password.html" class="forgot-link">Forgot password?</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../../utils/api.js"></script>
    <script src="../../utils/login_utils.js"></script>
    <script src="login.js"></script>
</body>
</html>
