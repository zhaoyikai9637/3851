<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JRS - Reset Password</title>
    <link rel="stylesheet" href="/shared-ui/tokens.css">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <link rel="stylesheet" href="../../assets/css/login.css">
    <link rel="stylesheet" href="../../assets/css/buttons.css">
</head>
<body class="login-page recovery-page">
    <!-- Header -->
    <header class="top-header">
        <div class="logo-container">
            <div class="logo-circles">
                <span class="circle circle-dark"></span>
                <span class="circle circle-blue"></span>
            </div>
            <div class="logo-text">
                <span class="logo-title">JRS</span>
                <span class="logo-subtitle">JOB RECRUITMENT SYSTEM</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="page-container">
        <div class="auth-card login-card">
            <h1 class="auth-title">Reset your password</h1>
            <p class="auth-subtitle">
                Enter your account email to request a password reset.
            </p>

                <form id="forgotPasswordForm" action="../check-email/check-email.html" method="GET" novalidate>
                <!-- Email Field -->
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Input your email address"
                        required
                    >
                    <div class="error-message" role="alert" id="emailError"></div>
                </div>

                <!-- Action Button -->
                <button type="submit" id="sendBtn" class="btn-primary">Send reset link</button>

                <div class="resend-container" style="margin-top: 24px;">
                    <a href="../login/login.html" class="resend-link"><svg class="jrs-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg> Back to Login</a>
                </div>
            </form>
        </div>
    </main>

    <script src="../../utils/api.js"></script>
    <script src="../../utils/forgot_utils.js"></script>
    <script src="forgot-password.js"></script>
</body>
</html>
